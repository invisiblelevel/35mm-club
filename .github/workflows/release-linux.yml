name: Build Linux

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app (Linux)
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      # Шаг 1: Создаём черновик релиза (если его ещё нет) и запоминаем его ID
      - name: Create or Get Draft Release
        id: release
        run: |
          # Проверяем, существует ли уже релиз для этого тега
          RELEASE_ID=$(gh release view ${{ github.ref_name }} --json id -q .id 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            # Если нет, создаём черновик
            gh release create ${{ github.ref_name }} \
              --title "35mm Club ${{ github.ref_name }}" \
              --notes "Linux build for 35mm Club ${{ github.ref_name }}." \
              --draft
            RELEASE_ID=$(gh release view ${{ github.ref_name }} --json id -q .id)
          fi
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Шаг 2: Явно загружаем все нужные файлы в релиз
      - name: Upload Linux Artifacts to Release
        run: |
          # Ищем все .deb, .rpm и .AppImage в папке bundle
          find src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec gh release upload ${{ github.ref_name }} {} \;
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}